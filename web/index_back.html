<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HAHAO GAMES — Play the Future</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="subtle-bg" class="subtle-bg" aria-hidden="true"></div>
  <header class="site-header">
      <div class="logo"><img src="assets/images/logo.svg" alt="HAHAO" height="28"></div>
    <nav class="nav">
      <a href="#games">Games</a>
      <a href="#community">Community</a>
      <a href="#team">Team</a>
      <a class="cta" href="#play">Play</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="home" style="background-image:url('assets/images/hero-bg.svg');background-size:cover;background-position:center;">
      <div class="hero-inner">
        <h1 class="hero-title">Play the Future</h1>
        <p class="lead">누구나 쉽게 게임을 만들고, 함께 성장하는 플랫폼</p>
        <div class="hero-ctas">
          <a class="btn primary" href="#games">Play</a>
          <a class="btn" href="#community">Community</a>
        </div>
      </div>
    </section>

    <section id="games" class="section">
      <h2 class="section-title">Featured Games</h2>
      <div class="games-grid" id="gamesGrid"></div>
    </section>

    <section id="community" class="section muted">
      <h2 class="section-title">Ludara — Community Preview</h2>
      <div id="communityFeed" class="community-preview"></div>
    </section>

    <section id="team" class="section">
      <h2 class="section-title">Team</h2>
      <div class="team-grid">
        <div class="team-card glass">
          <div class="avatar">S</div>
          <h4>Sarah</h4>
          <p>Management</p>
        </div>
        <div class="team-card glass">
          <div class="avatar">C</div>
          <h4>Christopher</h4>
          <p>Development</p>
        </div>
        <div class="team-card glass">
          <div class="avatar">St</div>
          <h4>Stephanie</h4>
          <p>Marketing</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="logo">HAHAO GAMES</div>
      <p>Connect • Create • Play • Future</p>
    </div>
  </footer>

  <!-- Game modal -->
  <div id="gameModal" class="game-modal" aria-hidden="true">
    <div class="game-modal-inner">
      <button id="modalClose" class="modal-close" aria-label="Close">×</button>
      <iframe id="gameFrame" src="" frameborder="0" allowfullscreen></iframe>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
