<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CrazyTetris3D — HAHAO</title>
  <style>
    html,body{height:100%;margin:0;font-family:Inter,Arial,Helvetica,sans-serif;background:#0f1720;color:#fff;display:flex;align-items:center;justify-content:center}
    .wrap{width:820px;max-width:94%;background:linear-gradient(180deg,#0b1220 0%, #071018 100%);padding:28px;border-radius:12px;box-shadow:0 30px 80px rgba(2,6,23,0.6)}
    h1{margin:0 0 10px;font-size:28px}
    p{color:#9aa0a6}
    #start{margin-top:18px;padding:10px 14px;border-radius:8px;border:0;background:#fff;color:#071018;font-weight:600}
    .placeholder-3d{width:100%;height:420px;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);border-radius:10px;margin-top:18px;display:flex;align-items:center;justify-content:center;color:#9aa0a6}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>CrazyTetris3D</h1>
    <p>A 3D-inspired Tetris experience — demo placeholder (loads in iframe from HAHAO).</p>
    <div class="placeholder-3d">CrazyTetris3D preview — coming soon</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
      <div style="color:#6b7280;font-size:13px">Author: HAHAO Studio</div>
      <button id="start">Start</button>
    </div>
  </div>
  <script>
    document.getElementById('start').addEventListener('click',()=>{
      // If embedded in modal iframe, focus; otherwise open in new window
      if(window.self !== window.top){
        // inside iframe
        window.focus();
      } else {
        window.open(window.location.href,'_blank');
      }
    });
  </script>
</body>
</html>
